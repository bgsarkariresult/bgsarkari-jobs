<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Jobs - Latest Government Jobs, Results, Admit Card</title>
    <meta name="description" content="BG Jobs - Get latest government job updates, results, admit cards, syllabus, and daily current affairs.">
    <meta name="keywords" content="BG Jobs, Latest Jobs, Admit Card, Sarkari Result, Syllabus, Current Affairs">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">BG Jobs</div>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search Jobs, Results..." onkeyup="searchJobs()">
            <button id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
        </div>
    </header>

    <div class="container">
        <!-- Grid Categories -->
        <div class="grid">
            <div class="card">
                <h2>✅ Latest Jobs</h2>
                <ul id="latest_jobs"></ul>
            </div>
            <div class="card">
                <h2>✅ Results</h2>
                <ul id="results"></ul>
            </div>
            <div class="card">
                <h2>✅ Admit Card</h2>
                <ul id="admit_card"></ul>
            </div>
            <div class="card">
                <h2>✅ Answer Key</h2>
                <ul id="answer_key"></ul>
            </div>
            <div class="card">
                <h2>✅ Syllabus</h2>
                <ul id="syllabus"></ul>
            </div>
            <div class="card">
                <h2>✅ Current Affairs</h2>
                <ul id="current_affairs"></ul>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 BG Jobs. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
